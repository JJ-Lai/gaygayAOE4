spring:
  datasource:
    url: jdbc:h2:mem:aoe4test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: false

aoe4:
  sync:
    enabled: false
  summary:
    sync-enabled: false
  aggregation:
    enabled: false
  ops:
    alert-webhook-enabled: false
    alert-check-cron: "-"

logging:
  level:
    com.aoe4: WARN
