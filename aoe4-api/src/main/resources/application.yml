spring:
  application:
    name: aoe4-analytics
  datasource:
    url: jdbc:h2:file:./data/aoe4db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    export:
      prometheus:
        enabled: true

aoe4:
  api:
    base-url: https://aoe4world.com/api/v0
    user-agent: "AOE4-Analytics/0.1 (dev; contact: local)"
    timeout: 30s
    max-retries: 3
  sync:
    enabled: true
    cron: "0 */30 * * * *"
    default-profile-ids:
      - 10861747
    games-page-size: 50
  summary:
    base-url: https://aoe4world.com
    api-key: ${AOE4_SUMMARY_API_KEY:}
    request-interval: 2s
    cache-ttl: 7d
    negative-cache-ttl: 3m
    batch-size: 5
    sync-enabled: true
    sync-cron: "0 */5 * * * *"
  frontend:
    spa-enabled: false
  aggregation:
    enabled: true
    refresh-cron: "0 0 */6 * * *"
    api-cache-ttl: 5m
  ops:
    alert-webhook-enabled: false
    alert-webhook-url: ""
    alert-check-cron: "0 */15 * * * *"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.aoe4: INFO
