# 範例 Alertmanager 設定：Prometheus 告警 → Slack
# 用法：
#   1. 複製為 alertmanager.yml 並填入 Slack webhook
#   2. docker compose -f docker-compose.monitoring.yml -f docker-compose.alerting.yml up
#
# Slack Incoming Webhook：https://api.slack.com/messaging/webhooks

global:
  resolve_timeout: 5m

route:
  receiver: slack-default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: slack-default
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
        channel: '#aoe4-alerts'
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}
          *{{ .Labels.severity }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
