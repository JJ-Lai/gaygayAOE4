# 一鍵啟動：PostgreSQL + 應用 + Prometheus + Grafana
# 用法：docker compose -f docker-compose.postgres.full.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aoe4
      POSTGRES_USER: aoe4
      POSTGRES_PASSWORD: aoe4
    ports:
      - "5432:5432"
    volumes:
      - aoe4-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoe4 -d aoe4"]
      interval: 5s
      timeout: 5s
      retries: 10

  aoe4:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: aoe4
      POSTGRES_USER: aoe4
      POSTGRES_PASSWORD: aoe4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    depends_on:
      - aoe4

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/aoe4-overview.json:/var/lib/grafana/dashboards/aoe4-overview.json:ro
    depends_on:
      - prometheus

volumes:
  aoe4-pg-data:
