name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B -pl aoe4-api -am test

  frontend:
    name: Frontend (build + E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: aoe4-frontend/package-lock.json

      - name: Install dependencies
        working-directory: aoe4-frontend
        run: npm ci

      - name: Build
        working-directory: aoe4-frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: aoe4-frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: aoe4-frontend
        run: npm run test:e2e
        env:
          CI: true
