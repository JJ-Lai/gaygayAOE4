services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aoe4
      POSTGRES_USER: aoe4
      POSTGRES_PASSWORD: aoe4
    ports:
      - "5432:5432"
    volumes:
      - aoe4-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aoe4 -d aoe4"]
      interval: 5s
      timeout: 5s
      retries: 10

  aoe4:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod,postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: aoe4
      POSTGRES_USER: aoe4
      POSTGRES_PASSWORD: aoe4
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aoe4-pg-data:
